<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#538A95">
<title>Capturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root{
    --font-display:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
    --font-body:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

    --accent:#538A95;
    --accent-strong:#3E6C76;
    --accent-soft:#DCEAEC;
    --accent-contrast:#FFFFFF;

    --page-bg:#EBF1F2;
    --bg:#FFFFFF;
    --surface:#F6F9FA;
    --surface-raised:#FFFFFF;
    --border:#E3EAEC;
    --text:#17262A;
    --text-muted:#5E7378;
    --text-faint:#93A6AA;

    --danger:#B5533F;
    --danger-soft:#F5E4E0;
    --success:#4C8B63;
    --success-soft:#E4F0E7;
    --warning:#B4842B;
    --warning-soft:#F3EBDA;

    --shadow-card:0 1px 2px rgba(23,38,42,.07),0 1px 1px rgba(23,38,42,.05);
    --shadow-raised:0 16px 40px rgba(23,38,42,.22);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:22px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --page-bg:#070B0C;
      --bg:#10191B;
      --surface:#172224;
      --surface-raised:#1C2829;
      --border:#2A3A3C;
      --text:#E9F1F1;
      --text-muted:#93A9AC;
      --text-faint:#5B7275;
      --accent:#72ADB8;
      --accent-strong:#93C5CE;
      --accent-soft:#20393D;
      --accent-contrast:#08191B;
      --danger:#DE9784;
      --danger-soft:#3A241F;
      --success:#8CC7A2;
      --success-soft:#20321F;
      --warning:#DDB671;
      --warning-soft:#332918;
      --shadow-card:0 1px 2px rgba(0,0,0,.4);
      --shadow-raised:0 16px 40px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#070B0C;
    --bg:#10191B;
    --surface:#172224;
    --surface-raised:#1C2829;
    --border:#2A3A3C;
    --text:#E9F1F1;
    --text-muted:#93A9AC;
    --text-faint:#5B7275;
    --accent:#72ADB8;
    --accent-strong:#93C5CE;
    --accent-soft:#20393D;
    --accent-contrast:#08191B;
    --danger:#DE9784;
    --danger-soft:#3A241F;
    --success:#8CC7A2;
    --success-soft:#20321F;
    --warning:#DDB671;
    --warning-soft:#332918;
    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    --shadow-raised:0 16px 40px rgba(0,0,0,.55);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit}
  input,textarea{font:inherit;color:inherit;background:none;border:none}
  input:focus,textarea:focus{outline:none}
  ::selection{background:var(--accent-soft);color:var(--text)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }

  /* ---------- app shell ---------- */
  .app{
    width:100%;
    max-width:460px;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:var(--shadow-raised);
  }
  @media (min-width:460px){
    body{padding:28px 16px}
    .app{min-height:min(880px,calc(100dvh - 56px));border-radius:28px;overflow:hidden}
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:18px 18px 14px;
    flex:none;
  }
  .topbar-title{display:flex;align-items:center;gap:10px}
  .topbar-title .icon-badge{
    width:34px;height:34px;border-radius:10px;
    background:var(--accent-soft);color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .topbar-title .icon-badge svg{width:19px;height:19px}
  .topbar h1{font-size:1.28rem;font-weight:700;letter-spacing:-.01em}
  .topbar-actions{display:flex;gap:4px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:none;background:transparent;
    color:var(--text-muted);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .icon-btn:hover{background:var(--surface);color:var(--text)}
  .icon-btn svg{width:19px;height:19px}

  .persist-flag{
    margin:0 18px 10px;padding:8px 12px;border-radius:10px;
    background:var(--warning-soft);color:var(--warning);
    font-size:.78rem;display:none;align-items:center;gap:8px;
  }
  .persist-flag.show{display:flex}
  .persist-flag svg{width:15px;height:15px;flex:none}

  /* ---------- content ---------- */
  .content{
    flex:1 1 auto;
    overflow-y:auto;
    padding:2px 18px 110px;
  }
  .tab-heading{margin:6px 0 14px}
  .tab-heading p{color:var(--text-muted);font-size:.85rem;margin-top:3px}

  .card-list{display:flex;flex-direction:column;gap:10px}

  .empty-state{
    margin-top:34px;text-align:center;color:var(--text-muted);
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .empty-state .icon-badge-lg{
    width:52px;height:52px;border-radius:16px;background:var(--surface);
    color:var(--text-faint);display:flex;align-items:center;justify-content:center;
  }
  .empty-state .icon-badge-lg svg{width:24px;height:24px}
  .empty-state strong{color:var(--text);font-family:var(--font-display);font-size:1rem;font-weight:600}
  .empty-state span{font-size:.85rem;max-width:260px;line-height:1.4}

  /* ---------- block card ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:13px 8px 13px 14px;
    display:flex;align-items:flex-start;gap:10px;
    position:relative;
    border-left:3px solid var(--accent);
    box-shadow:var(--shadow-card);
    cursor:pointer;
  }
  .card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:1px}
  .card-title{
    font-family:var(--font-display);font-weight:600;font-size:.98rem;
    color:var(--text);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .card-meta{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.72rem;color:var(--text-faint)}
  .card-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-faint)}

  .card-menu-wrap{position:relative;flex:none}
  .kebab-btn{
    width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-faint);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .kebab-btn:hover{background:var(--bg);color:var(--text-muted)}
  .kebab-btn svg{width:17px;height:17px}

  .menu{
    position:absolute;top:34px;right:0;z-index:30;
    background:var(--surface-raised);border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow-raised);
    min-width:188px;padding:6px;display:none;
  }
  .menu.open{display:block}
  .menu-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);padding:8px 10px 4px}
  .menu-item{
    width:100%;text-align:left;padding:8px 10px;border-radius:7px;border:none;background:none;
    display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--text);cursor:pointer;
  }
  .menu-item svg{width:15px;height:15px;color:var(--text-muted);flex:none}
  .menu-item:hover{background:var(--surface)}
  .menu-item.danger{color:var(--danger)}
  .menu-item.danger svg{color:var(--danger)}
  .menu-item[disabled]{opacity:.35;cursor:default}
  .menu-item[disabled]:hover{background:none}
  .menu-sep{height:1px;background:var(--border);margin:6px 2px}

  /* ---------- bottom nav + fab ---------- */
  .navbar{
    flex:none;position:relative;
    display:flex;border-top:1px solid var(--border);background:var(--bg);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  }
  .nav-btn{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px 2px;color:var(--text-faint);cursor:pointer;border-radius:10px;
  }
  .nav-btn svg{width:21px;height:21px}
  .nav-btn span{font-size:.66rem;font-weight:600;letter-spacing:.01em}
  .nav-btn.active{color:var(--accent)}
  .nav-gap{width:64px;flex:none}

  .fab{
    position:absolute;left:50%;top:-26px;transform:translateX(-50%);
    width:56px;height:56px;border-radius:50%;border:none;
    background:var(--accent);color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 22px rgba(83,138,149,.42);cursor:pointer;
    transition:transform .12s ease;
  }
  :root[data-theme="dark"] .fab,
  @media (prefers-color-scheme:dark){}
  .fab:active{transform:translateX(-50%) scale(.94)}
  .fab svg{width:25px;height:25px}

  /* ---------- overlay + sheet ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,16,17,.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:460px;max-height:88dvh;background:var(--bg);
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;
    transform:translateY(16px);transition:transform .18s ease;overflow:hidden;
  }
  .overlay.open .sheet{transform:translateY(0)}
  .sheet-header{
    flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border);
  }
  .sheet-title-input{
    flex:1;font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--text);
    padding:6px 4px;border-radius:8px;
  }
  .sheet-title-input:focus{background:var(--surface)}
  .sheet-body{flex:1;overflow-y:auto;padding:14px}

  .triage-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
    padding:7px 12px;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .chip svg{width:13px;height:13px}
  .chip.current{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent;cursor:default}
  .chip.ghost{background:transparent}

  .section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin:0 0 8px;font-weight:600}
  .sub-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
  .sub-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px}
  .sub-card-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .sub-type-tag{font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;flex:none}
  .sub-title-input{flex:1;font-size:.86rem;font-weight:600;color:var(--text)}
  .sub-del{width:24px;height:24px;border-radius:7px;border:none;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .sub-del:hover{background:var(--danger-soft);color:var(--danger)}
  .sub-del svg{width:14px;height:14px}
  .sub-textarea{width:100%;min-height:52px;resize:vertical;font-size:.86rem;line-height:1.45;color:var(--text)}
  .sub-textarea::placeholder{color:var(--text-faint)}

  .list-items,.check-items{display:flex;flex-direction:column;gap:6px}
  .list-item,.check-item{display:flex;align-items:center;gap:8px}
  .list-item .bullet{width:5px;height:5px;border-radius:50%;background:var(--text-faint);flex:none}
  .check-item .box{
    width:18px;height:18px;border-radius:6px;border:1.6px solid var(--border);flex:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--accent-contrast);
  }
  .check-item .box.done{background:var(--success);border-color:var(--success)}
  .check-item .box svg{width:12px;height:12px}
  .item-text{flex:1;font-size:.86rem;padding:3px 2px}
  .check-item.done .item-text{color:var(--text-faint);text-decoration:line-through}
  .item-del{width:20px;height:20px;border-radius:6px;border:none;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .item-del svg{width:12px;height:12px}
  .item-add{display:flex;align-items:center;gap:8px;color:var(--text-faint);font-size:.83rem;margin-top:2px}
  .item-add svg{width:14px;height:14px;flex:none}
  .item-add input{flex:1;padding:3px 2px}
  .item-add input::placeholder{color:var(--text-faint)}

  .add-sub-row{display:flex;gap:8px}
  .add-sub-btn{
    flex:1;border:1px dashed var(--border);border-radius:var(--radius-sm);background:none;
    color:var(--text-muted);padding:10px;font-size:.82rem;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .add-sub-btn:hover{border-color:var(--accent);color:var(--accent-strong)}
  .add-sub-btn svg{width:14px;height:14px}

  .type-picker{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .type-opt{
    flex:1;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);
    padding:9px 6px;text-align:center;cursor:pointer;color:var(--text-muted);
  }
  .type-opt:hover{border-color:var(--accent)}
  .type-opt svg{width:16px;height:16px;margin-bottom:3px}
  .type-opt span{display:block;font-size:.72rem;font-weight:600}

  /* ---------- generic modal (backup, archive) ---------- */
  .modal-body h2{font-size:1.05rem;margin-bottom:4px}
  .modal-body p.hint{color:var(--text-muted);font-size:.83rem;margin-bottom:12px;line-height:1.45}
  .backup-textarea{
    width:100%;min-height:150px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);padding:10px;font-family:var(--font-mono);font-size:.74rem;
    color:var(--text);line-height:1.5;resize:vertical;
  }
  .btn-row{display:flex;gap:8px;margin-top:12px}
  .btn{
    flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn svg{width:14px;height:14px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
  .btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
  .btn.ghost{background:none}

  .archive-tabs{display:flex;gap:6px;margin-bottom:14px}
  .archive-tab{flex:1;padding:8px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:.82rem;font-weight:600;cursor:pointer}
  .archive-tab.active{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
  .archive-row{
    display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);
  }
  .archive-row:last-child{border-bottom:none}
  .archive-row .info{flex:1;min-width:0}
  .archive-row .info .t{font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .archive-row .info .m{font-size:.72rem;color:var(--text-faint);font-family:var(--font-mono)}
  .archive-row .actions{display:flex;gap:6px;flex:none}
  .mini-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:.74rem;font-weight:600;cursor:pointer}
  .mini-btn:hover{background:var(--surface)}
  .mini-btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-soft)}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);
    background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;
    font-size:.83rem;font-weight:500;z-index:200;opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;box-shadow:var(--shadow-raised);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-title">
      <span class="icon-badge" id="tabIcon"></span>
      <h1 id="tabTitle">Leitura</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnArchive" title="Arquivo e lixeira" aria-label="Arquivo e lixeira"></button>
      <button class="icon-btn" id="btnBackup" title="Backup" aria-label="Backup"></button>
      <button class="icon-btn" id="btnTheme" title="Tema" aria-label="Alternar tema"></button>
    </div>
  </header>

  <div class="persist-flag" id="persistFlag"></div>

  <main class="content">
    <div class="tab-heading">
      <p id="tabDesc"></p>
    </div>
    <div class="card-list" id="cardList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="icon-badge-lg" id="emptyIcon"></div>
      <strong id="emptyTitle"></strong>
      <span id="emptyDesc"></span>
    </div>
  </main>

  <nav class="navbar" id="navbar"></nav>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================= icons ================= */
function icon(name){
  const P = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
  const map = {
    book: P+'<path d="M4 5.2C4 4.3 4.8 4 6 4h5.2c1 0 1.8.4 1.8 1.4v14.4c0-1-1-1.4-2-1.4H6c-1.1 0-2 .3-2 1.2Z"/><path d="M20 5.2c0-.9-.8-1.2-2-1.2h-5.2c-1 0-1.8.4-1.8 1.4v14.4c0-1 1-1.4 2-1.4H18c1.1 0 2 .3 2 1.2Z"/></svg>',
    bulb: P+'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M7 10a5 5 0 1 1 8.6 3.5c-.7.7-1.3 1.6-1.4 2.5H9.8c-.1-.9-.7-1.8-1.4-2.5A4.98 4.98 0 0 1 7 10Z"/></svg>',
    target: P+'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
    cap: P+'<path d="M2 8.5 12 4l10 4.5-10 4.5-10-4.5Z"/><path d="M6 10.8V16c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-5.2"/><path d="M21 9v6"/></svg>',
    plus: P+'<path d="M12 5v14M5 12h14"/></svg>',
    sun: P+'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>',
    moon: P+'<path d="M20 14.7A8.5 8.5 0 1 1 9.3 4a7 7 0 0 0 10.7 10.7Z"/></svg>',
    monitor: P+'<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8M12 16.5V20"/></svg>',
    archive: P+'<rect x="3.5" y="4" width="17" height="4.4" rx="1.2"/><path d="M4.5 8.4V18a1.6 1.6 0 0 0 1.6 1.6h11.8A1.6 1.6 0 0 0 19.5 18V8.4"/><path d="M10 12.5h4"/></svg>',

    close: P+'<path d="M5 5l14 14M19 5 5 19"/></svg>',
    kebab: P+'<circle cx="12" cy="5.2" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="18.8" r="1.15" fill="currentColor" stroke="none"/></svg>',
    check: P+'<path d="M4.5 12.5l5 5 10-10"/></svg>',
    up: P+'<path d="M5 15l7-7 7 7"/></svg>',
    down: P+'<path d="M5 9l7 7 7-7"/></svg>',
    move: P+'<path d="M12 3v18M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>',
    box: P+'<path d="M4 8.4 12 4l8 4.4v7.2L12 20l-8-4.4Z"/><path d="M4 8.4 12 12.7l8-4.3M12 12.7V20"/></svg>',
    del: P+'<path d="M4.5 12.5l5 5 10-10"/></svg>',
    text: P+'<path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg>',
    list: P+'<circle cx="5.5" cy="6.5" r="1" fill="currentColor" stroke="none"/><circle cx="5.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="5.5" cy="17.5" r="1" fill="currentColor" stroke="none"/><path d="M9.5 6.5h9M9.5 12h9M9.5 17.5h9"/></svg>',
    checklist: P+'<path d="M4.5 6.7l1.6 1.6 2.7-2.9"/><path d="M4.5 13.7l1.6 1.6 2.7-2.9"/><path d="M11.5 6.5h8M11.5 14.5h8M4.5 20h3M11.5 20h8"/></svg>',
    download: P+'<path d="M12 4v11.5M7.5 11.5 12 16l4.5-4.5"/><path d="M5 18.5h14"/></svg>',
    upload: P+'<path d="M12 20V8.5M7.5 12.5 12 8l4.5 4.5"/><path d="M5 18.5h14"/></svg>',
    copy: P+'<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.6A1.6 1.6 0 0 0 13.9 5H6.6A1.6 1.6 0 0 0 5 6.6v7.3a1.6 1.6 0 0 0 1.6 1.6h1.9"/></svg>',
    back: P+'<path d="M15 5 8 12l7 7"/></svg>',
    warn: P+'<path d="M12 3.5 21 19.5H3Z"/><path d="M12 9.5v4.2M12 17h.01"/></svg>'
  };
  return map[name] || '';
}

/* ================= constants ================= */
var TABS = [
  { key:'leitura',  label:'Leitura',  icon:'book',    desc:'O que você está lendo ou quer ler.' },
  { key:'insights',  label:'Insights', icon:'bulb',    desc:'Ideias e percepções soltas, para amadurecer.' },
  { key:'execucao', label:'Execução', icon:'target',  desc:'O que precisa sair do papel agora.' },
  { key:'estudos',  label:'Estudos',  icon:'cap',     desc:'Conteúdo de estudo e anotações de aprendizado.' }
];
var SUB_TYPES = [
  { key:'nota', label:'Nota', icon:'text' },
  { key:'lista', label:'Lista', icon:'list' },
  { key:'checklist', label:'Checklist', icon:'checklist' }
];
var STORAGE_KEY = 'captura_app_v1';
var THEME_KEY = 'captura_app_theme';

/* ================= state ================= */
var state = null;
var persistOk = true;
var currentTab = 'leitura';
var detailBlockId = null;
var archiveOpen = false;
var archiveMode = 'archived'; // or 'trashed'
var openMenuId = null;
var pendingDeleteId = null; // two-step confirm for permanent delete
var toastTimer = null;

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function seedData(){
  var now = new Date().toISOString();
  function block(tab, title, subs){
    return { id: uid('b'), tab: tab, title: title, order: Date.now()+Math.random(),
      archived:false, trashed:false, createdAt: now, updatedAt: now, subblocks: subs };
  }
  function nota(title, content){ return { id: uid('s'), type:'nota', title:title, content:content, items:[] }; }
  function lista(title, items){ return { id: uid('s'), type:'lista', title:title, content:'', items: items.map(function(t){return {id:uid('i'),text:t,done:false};}) }; }
  function checklist(title, items){ return { id: uid('s'), type:'checklist', title:title, content:'', items: items.map(function(t,i){return {id:uid('i'),text:t,done:i===0};}) }; }

  return {
    blocks: [
      block('leitura', 'Exemplo — pode excluir', [ nota('Por que este bloco existe', 'Toque no bloco para abrir. Dentro dele você cria sub-blocos de texto, lista ou checklist.') ]),
      block('insights', 'Exemplo — pode excluir', [ nota('Captura rápida', 'Use o botão + para criar um bloco novo direto nesta aba, sem sair dela.') ]),
      block('execucao', 'Exemplo — pode excluir', [ checklist('Primeiros passos', ['Renomear este bloco', 'Criar um checklist seu', 'Mover um bloco entre abas']) ]),
      block('estudos', 'Exemplo — pode excluir', [ lista('Ideias de uso', ['Resumos de leitura', 'Anotações de aula', 'Vocabulário novo']) ])
    ]
  };
}

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
    else { state = seedData(); save(); }
    persistOk = true;
  }catch(e){
    persistOk = false;
    state = seedData();
  }
  document.getElementById('persistFlag').classList.toggle('show', !persistOk);
  if(!persistOk){
    document.getElementById('persistFlag').innerHTML = icon('warn') + '<span>Armazenamento local indisponível neste navegador — as alterações não serão salvas ao fechar.</span>';
  }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); persistOk = true; }
  catch(e){ persistOk = false; }
  document.getElementById('persistFlag').classList.toggle('show', !persistOk);
}

function touch(block){ block.updatedAt = new Date().toISOString(); }

function tabInfo(key){ for(var i=0;i<TABS.length;i++){ if(TABS[i].key===key) return TABS[i]; } return TABS[0]; }

function fmtTime(iso){
  var d = new Date(iso);
  var now = new Date();
  var sameDay = d.toDateString() === now.toDateString();
  var pad = function(n){ return (n<10?'0':'')+n; };
  if(sameDay) return pad(d.getHours())+':'+pad(d.getMinutes());
  return pad(d.getDate())+'/'+pad(d.getMonth()+1);
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ================= theme ================= */
function applyTheme(){
  var pref = 'system';
  try{ pref = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}
  var root = document.documentElement;
  if(pref==='light') root.setAttribute('data-theme','light');
  else if(pref==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  var btn = document.getElementById('btnTheme');
  btn.innerHTML = icon(pref==='light'?'sun':pref==='dark'?'moon':'monitor');
  btn.title = 'Tema: ' + (pref==='light'?'claro':pref==='dark'?'escuro':'sistema') + ' (toque para alternar)';
}
function cycleTheme(){
  var pref = 'system';
  try{ pref = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}
  var next = pref==='system' ? 'light' : pref==='light' ? 'dark' : 'system';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme();
}

/* ================= rendering: shell ================= */
function renderNav(){
  var nav = document.getElementById('navbar');
  nav.innerHTML = '';
  TABS.slice(0,2).forEach(function(t){ nav.appendChild(navButton(t)); });
  var gap = document.createElement('div');
  gap.className = 'nav-gap';
  nav.appendChild(gap);
  TABS.slice(2).forEach(function(t){ nav.appendChild(navButton(t)); });

  var fab = document.createElement('button');
  fab.className = 'fab';
  fab.setAttribute('aria-label','Criar bloco nesta aba');
  fab.innerHTML = icon('plus');
  fab.addEventListener('click', function(){ quickCapture(); });
  nav.appendChild(fab);
}
function navButton(t){
  var b = document.createElement('button');
  b.className = 'nav-btn' + (t.key===currentTab?' active':'');
  b.innerHTML = icon(t.icon) + '<span>'+t.label+'</span>';
  b.addEventListener('click', function(){ currentTab = t.key; closeMenus(); render(); });
  return b;
}

function renderHeader(){
  var t = tabInfo(currentTab);
  document.getElementById('tabTitle').textContent = t.label;
  document.getElementById('tabDesc').textContent = t.desc;
  document.getElementById('tabIcon').innerHTML = icon(t.icon);
}

/* ================= rendering: cards ================= */
function visibleBlocks(){
  return state.blocks
    .filter(function(b){ return b.tab===currentTab && !b.archived && !b.trashed; })
    .sort(function(a,b){ return a.order-b.order; });
}

function render(){
  renderHeader();
  renderNav();
  var list = document.getElementById('cardList');
  var empty = document.getElementById('emptyState');
  list.innerHTML = '';
  var blocks = visibleBlocks();
  if(blocks.length===0){
    empty.style.display = 'flex';
    var t = tabInfo(currentTab);
    document.getElementById('emptyIcon').innerHTML = icon(t.icon);
    document.getElementById('emptyTitle').textContent = 'Nada em ' + t.label + ' ainda';
    document.getElementById('emptyDesc').textContent = 'Toque no + para capturar a primeira ideia aqui.';
  } else {
    empty.style.display = 'none';
    blocks.forEach(function(b, idx){ list.appendChild(renderCard(b, idx, blocks.length)); });
  }
  if(detailBlockId){ renderDetail(); }
  if(archiveOpen){ renderArchive(); }
}

function renderCard(b, idx, total){
  var card = document.createElement('div');
  card.className = 'card';
  card.addEventListener('click', function(){ openDetail(b.id); });

  var main = document.createElement('div');
  main.className = 'card-main';
  var title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = b.title || 'Sem título';
  var meta = document.createElement('div');
  meta.className = 'card-meta';
  var count = b.subblocks.length;
  meta.innerHTML = '<span>'+count+' sub-bloco'+(count===1?'':'s')+'</span><span class="dot"></span><span>'+fmtTime(b.updatedAt)+'</span>';
  main.appendChild(title); main.appendChild(meta);

  var menuWrap = document.createElement('div');
  menuWrap.className = 'card-menu-wrap';
  var kebab = document.createElement('button');
  kebab.className = 'kebab-btn';
  kebab.setAttribute('aria-label','Mais ações');
  kebab.innerHTML = icon('kebab');
  kebab.addEventListener('click', function(ev){
    ev.stopPropagation();
    openMenuId = (openMenuId===b.id) ? null : b.id;
    render();
  });
  menuWrap.appendChild(kebab);

  if(openMenuId===b.id){
    var menu = document.createElement('div');
    menu.className = 'menu open';
    menu.addEventListener('click', function(ev){ ev.stopPropagation(); });

    menu.appendChild(menuItem('up','Mover para cima', idx>0, function(){ reorder(b, -1); }));
    menu.appendChild(menuItem('down','Mover para baixo', idx<total-1, function(){ reorder(b, 1); }));
    var sep1 = document.createElement('div'); sep1.className='menu-sep'; menu.appendChild(sep1);

    var lbl = document.createElement('div'); lbl.className='menu-label'; lbl.textContent='Mover para'; menu.appendChild(lbl);
    TABS.filter(function(t){ return t.key!==b.tab; }).forEach(function(t){
      menu.appendChild(menuItem(t.icon, t.label, true, function(){ moveToTab(b, t.key); }));
    });
    var sep2 = document.createElement('div'); sep2.className='menu-sep'; menu.appendChild(sep2);
    menu.appendChild(menuItem('archive','Arquivar', true, function(){ archiveBlock(b); }));
    menu.appendChild(menuItem('trash','Mover para lixeira', true, function(){ trashBlock(b); }, true));
    menuWrap.appendChild(menu);
  }

  card.appendChild(main);
  card.appendChild(menuWrap);
  return card;
}
function menuItem(iconName, label, enabled, onClick, danger){
  var btn = document.createElement('button');
  btn.className = 'menu-item' + (danger?' danger':'');
  btn.innerHTML = icon(iconName) + '<span>'+label+'</span>';
  if(!enabled){ btn.disabled = true; }
  else { btn.addEventListener('click', function(){ openMenuId=null; onClick(); }); }
  return btn;
}
function closeMenus(){ openMenuId = null; }

function reorder(block, dir){
  var siblings = visibleBlocks();
  var idx = siblings.indexOf(block);
  var swapWith = siblings[idx+dir];
  if(!swapWith) return;
  var tmp = block.order;
  block.order = swapWith.order;
  swapWith.order = tmp;
  save(); render();
}
function moveToTab(block, tabKey){
  block.tab = tabKey; touch(block); save();
  render();
  toast('Movido para ' + tabInfo(tabKey).label);
}
function archiveBlock(block){
  block.archived = true; block.trashed = false; touch(block); save();
  if(detailBlockId===block.id) closeDetail(); else render();
  toast('Bloco arquivado');
}
function trashBlock(block){
  block.trashed = true; block.archived = false; touch(block); save();
  if(detailBlockId===block.id) closeDetail(); else render();
  toast('Bloco movido para a lixeira');
}
function restoreBlock(block){
  block.trashed = false; block.archived = false; touch(block); save();
  render();
  toast('Bloco restaurado em ' + tabInfo(block.tab).label);
}
function deleteForever(block){
  state.blocks = state.blocks.filter(function(b){ return b.id!==block.id; });
  save(); render();
  toast('Excluído definitivamente');
}

/* ================= quick capture ================= */
function quickCapture(){
  var now = new Date().toISOString();
  var b = { id: uid('b'), tab: currentTab, title: '', order: Date.now(),
    archived:false, trashed:false, createdAt: now, updatedAt: now, subblocks: [] };
  state.blocks.push(b);
  save();
  openDetail(b.id, true);
}

/* ================= detail sheet ================= */
var overlayEl = null;
function ensureOverlay(id){
  var ov = document.getElementById(id);
  if(ov) return ov;
  ov = document.createElement('div');
  ov.id = id;
  ov.className = 'overlay';
  document.body.appendChild(ov);
  return ov;
}

function openDetail(id, focusTitle){
  detailBlockId = id;
  closeMenus();
  render();
  requestAnimationFrame(function(){
    var ov = document.getElementById('detailOverlay');
    if(ov) ov.classList.add('open');
    if(focusTitle){
      var input = document.getElementById('detailTitleInput');
      if(input) input.focus();
    }
  });
}
function closeDetail(){
  var ov = document.getElementById('detailOverlay');
  if(ov){ ov.classList.remove('open'); }
  var id = detailBlockId;
  detailBlockId = null;
  setTimeout(function(){
    var b = id && findBlock(id);
    if(b && !b.title.trim() && b.subblocks.length===0){
      state.blocks = state.blocks.filter(function(x){ return x.id!==id; });
      save();
    }
    if(ov && ov.parentNode) ov.parentNode.removeChild(ov);
    render();
  }, 180);
}
function findBlock(id){
  for(var i=0;i<state.blocks.length;i++){ if(state.blocks[i].id===id) return state.blocks[i]; }
  return null;
}

function renderDetail(){
  var b = findBlock(detailBlockId);
  if(!b){ detailBlockId = null; return; }
  var ov = ensureOverlay('detailOverlay');
  ov.innerHTML = '';
  ov.addEventListener('click', function(ev){ if(ev.target===ov) closeDetail(); });

  var sheet = document.createElement('div');
  sheet.className = 'sheet';

  // header
  var head = document.createElement('div');
  head.className = 'sheet-header';
  var back = document.createElement('button');
  back.className = 'icon-btn'; back.innerHTML = icon('back');
  back.addEventListener('click', closeDetail);
  var titleInput = document.createElement('input');
  titleInput.className = 'sheet-title-input';
  titleInput.id = 'detailTitleInput';
  titleInput.placeholder = 'Título do bloco';
  titleInput.value = b.title;
  titleInput.addEventListener('input', function(){ b.title = titleInput.value; touch(b); save(); syncCardListSilently(); });
  var closeBtn = document.createElement('button');
  closeBtn.className = 'icon-btn'; closeBtn.innerHTML = icon('close');
  closeBtn.addEventListener('click', closeDetail);
  head.appendChild(back); head.appendChild(titleInput); head.appendChild(closeBtn);

  // body
  var body = document.createElement('div');
  body.className = 'sheet-body';

  var triage = document.createElement('div');
  triage.className = 'triage-row';
  TABS.forEach(function(t){
    var chip = document.createElement('button');
    var isCurrent = t.key===b.tab;
    chip.className = 'chip' + (isCurrent?' current':'');
    chip.innerHTML = icon(t.icon) + '<span>'+t.label+'</span>';
    if(!isCurrent){ chip.addEventListener('click', function(){ moveToTab(b, t.key); }); }
    triage.appendChild(chip);
  });
  var archChip = document.createElement('button');
  archChip.className = 'chip ghost';
  archChip.innerHTML = icon('archive') + '<span>Arquivar</span>';
  archChip.addEventListener('click', function(){ archiveBlock(b); });
  var trashChip = document.createElement('button');
  trashChip.className = 'chip ghost';
  trashChip.innerHTML = icon('trash') + '<span>Lixeira</span>';
  trashChip.addEventListener('click', function(){ trashBlock(b); });
  triage.appendChild(archChip); triage.appendChild(trashChip);
  body.appendChild(triage);

  var lbl = document.createElement('p'); lbl.className='section-label'; lbl.textContent='Sub-blocos';
  body.appendChild(lbl);

  var subList = document.createElement('div'); subList.className = 'sub-list';
  b.subblocks.forEach(function(sb){ subList.appendChild(renderSubblock(b, sb)); });
  body.appendChild(subList);

  var addRow = document.createElement('div'); addRow.className='type-picker'; addRow.style.display='none';
  SUB_TYPES.forEach(function(st){
    var opt = document.createElement('button');
    opt.className = 'type-opt';
    opt.innerHTML = icon(st.icon) + '<span>'+st.label+'</span>';
    opt.addEventListener('click', function(){ addSubblock(b, st.key); addRow.style.display='none'; addBtnRow.style.display='flex'; });
    addRow.appendChild(opt);
  });
  body.appendChild(addRow);

  var addBtnRow = document.createElement('div'); addBtnRow.className='add-sub-row';
  var addBtn = document.createElement('button');
  addBtn.className = 'add-sub-btn';
  addBtn.innerHTML = icon('plus') + '<span>Novo sub-bloco</span>';
  addBtn.addEventListener('click', function(){
    addRow.style.display = addRow.style.display==='none' ? 'flex' : 'none';
  });
  addBtnRow.appendChild(addBtn);
  body.appendChild(addBtnRow);

  sheet.appendChild(head);
  sheet.appendChild(body);
  ov.appendChild(sheet);
}

function syncCardListSilently(){
  if(!archiveOpen){
    var list = document.getElementById('cardList');
    var empty = document.getElementById('emptyState');
    list.innerHTML = '';
    var blocks = visibleBlocks();
    if(blocks.length===0){ empty.style.display='flex'; }
    else { empty.style.display='none'; blocks.forEach(function(b, idx){ list.appendChild(renderCard(b, idx, blocks.length)); }); }
  }
}

function renderSubblock(block, sb){
  var card = document.createElement('div');
  card.className = 'sub-card';

  var head = document.createElement('div'); head.className = 'sub-card-head';
  var tag = document.createElement('span'); tag.className='sub-type-tag';
  tag.textContent = SUB_TYPES.filter(function(t){return t.key===sb.type;})[0].label;
  var titleInput = document.createElement('input');
  titleInput.className = 'sub-title-input';
  titleInput.placeholder = 'Título (opcional)';
  titleInput.value = sb.title || '';
  titleInput.addEventListener('input', function(){ sb.title = titleInput.value; touch(block); save(); });
  var del = document.createElement('button'); del.className='sub-del'; del.innerHTML = icon('trash');
  del.addEventListener('click', function(){ deleteSubblock(block, sb); });
  head.appendChild(tag); head.appendChild(titleInput); head.appendChild(del);
  card.appendChild(head);

  if(sb.type==='nota'){
    var ta = document.createElement('textarea');
    ta.className = 'sub-textarea';
    ta.placeholder = 'Escreva aqui...';
    ta.value = sb.content || '';
    ta.addEventListener('input', function(){ sb.content = ta.value; touch(block); save(); });
    card.appendChild(ta);
  } else {
    var itemsWrap = document.createElement('div');
    itemsWrap.className = sb.type==='checklist' ? 'check-items' : 'list-items';
    sb.items.forEach(function(it){
      var row = document.createElement('div');
      row.className = sb.type==='checklist' ? ('check-item'+(it.done?' done':'')) : 'list-item';
      if(sb.type==='checklist'){
        var box = document.createElement('button');
        box.className = 'box' + (it.done?' done':'');
        box.innerHTML = it.done ? icon('check') : '';
        box.addEventListener('click', function(){ it.done = !it.done; touch(block); save(); renderDetail(); });
        row.appendChild(box);
      } else {
        var bullet = document.createElement('span'); bullet.className='bullet'; row.appendChild(bullet);
      }
      var txt = document.createElement('input');
      txt.className = 'item-text';
      txt.value = it.text;
      txt.addEventListener('input', function(){ it.text = txt.value; touch(block); save(); });
      var idel = document.createElement('button'); idel.className='item-del'; idel.innerHTML = icon('close');
      idel.addEventListener('click', function(){
        sb.items = sb.items.filter(function(x){ return x.id!==it.id; });
        touch(block); save(); renderDetail();
      });
      row.appendChild(txt); row.appendChild(idel);
      itemsWrap.appendChild(row);
    });
    card.appendChild(itemsWrap);

    var addItem = document.createElement('div'); addItem.className='item-add';
    addItem.innerHTML = icon('plus');
    var newInput = document.createElement('input');
    newInput.placeholder = sb.type==='checklist' ? 'Novo item...' : 'Novo item da lista...';
    newInput.addEventListener('keydown', function(ev){
      if(ev.key==='Enter' && newInput.value.trim()){
        sb.items.push({ id: uid('i'), text: newInput.value.trim(), done:false });
        touch(block); save(); renderDetail();
      }
    });
    addItem.appendChild(newInput);
    card.appendChild(addItem);
  }
  return card;
}

function addSubblock(block, type){
  block.subblocks.push({ id: uid('s'), type: type, title:'', content:'', items: [] });
  touch(block); save();
  renderDetail();
}
function deleteSubblock(block, sb){
  block.subblocks = block.subblocks.filter(function(x){ return x.id!==sb.id; });
  touch(block); save();
  renderDetail();
}

/* ================= archive / trash ================= */
function openArchive(){
  archiveOpen = true;
  render();
  var wrap = ensureOverlay('archiveOverlay');
  renderArchive();
  requestAnimationFrame(function(){ wrap.classList.add('open'); });
}
function closeArchive(){
  var ov = document.getElementById('archiveOverlay');
  if(ov) ov.classList.remove('open');
  archiveOpen = false;
  pendingDeleteId = null;
  setTimeout(function(){ if(ov && ov.parentNode) ov.parentNode.removeChild(ov); }, 180);
}
function renderArchive(){
  var ov = document.getElementById('archiveOverlay');
  if(!ov) return;
  ov.innerHTML = '';
  ov.addEventListener('click', function(ev){ if(ev.target===ov) closeArchive(); });

  var sheet = document.createElement('div'); sheet.className='sheet';
  var head = document.createElement('div'); head.className='sheet-header';
  var back = document.createElement('button'); back.className='icon-btn'; back.innerHTML=icon('back');
  back.addEventListener('click', closeArchive);
  var h2 = document.createElement('h2'); h2.style.flex='1'; h2.style.fontFamily='var(--font-display)'; h2.style.fontSize='1.05rem'; h2.textContent='Arquivo e lixeira';
  head.appendChild(back); head.appendChild(h2);
  sheet.appendChild(head);

  var body = document.createElement('div'); body.className='sheet-body';
  var tabs = document.createElement('div'); tabs.className='archive-tabs';
  var t1 = document.createElement('button'); t1.className='archive-tab'+(archiveMode==='archived'?' active':''); t1.textContent='Arquivados';
  t1.addEventListener('click', function(){ archiveMode='archived'; pendingDeleteId=null; renderArchive(); });
  var t2 = document.createElement('button'); t2.className='archive-tab'+(archiveMode==='trashed'?' active':''); t2.textContent='Lixeira';
  t2.addEventListener('click', function(){ archiveMode='trashed'; pendingDeleteId=null; renderArchive(); });
  tabs.appendChild(t1); tabs.appendChild(t2);
  body.appendChild(tabs);

  var items = state.blocks.filter(function(b){ return archiveMode==='archived' ? b.archived : b.trashed; })
    .sort(function(a,b){ return new Date(b.updatedAt)-new Date(a.updatedAt); });

  if(items.length===0){
    var empty = document.createElement('p'); empty.className='hint';
    empty.textContent = archiveMode==='archived' ? 'Nenhum bloco arquivado.' : 'A lixeira está vazia.';
    body.appendChild(empty);
  } else {
    items.forEach(function(b){
      var row = document.createElement('div'); row.className='archive-row';
      var info = document.createElement('div'); info.className='info';
      var t = document.createElement('div'); t.className='t'; t.textContent = b.title || 'Sem título';
      var m = document.createElement('div'); m.className='m'; m.textContent = tabInfo(b.tab).label + ' · ' + fmtTime(b.updatedAt);
      info.appendChild(t); info.appendChild(m);
      var actions = document.createElement('div'); actions.className='actions';
      var restore = document.createElement('button'); restore.className='mini-btn'; restore.textContent='Restaurar';
      restore.addEventListener('click', function(){ restoreBlock(b); renderArchive(); });
      actions.appendChild(restore);
      if(archiveMode==='trashed'){
        var del = document.createElement('button');
        del.className='mini-btn danger';
        del.textContent = pendingDeleteId===b.id ? 'Confirmar?' : 'Excluir';
        del.addEventListener('click', function(){
          if(pendingDeleteId===b.id){ deleteForever(b); pendingDeleteId=null; renderArchive(); }
          else { pendingDeleteId = b.id; renderArchive(); }
        });
        actions.appendChild(del);
      }
      row.appendChild(info); row.appendChild(actions);
      body.appendChild(row);
    });
  }
  sheet.appendChild(body);
  ov.appendChild(sheet);
}

/* ================= backup ================= */
function openBackup(){
  var ov = ensureOverlay('backupOverlay');
  ov.innerHTML = '';
  ov.addEventListener('click', function(ev){ if(ev.target===ov) closeBackup(); });
  var sheet = document.createElement('div'); sheet.className='sheet';
  var head = document.createElement('div'); head.className='sheet-header';
  var back = document.createElement('button'); back.className='icon-btn'; back.innerHTML=icon('back');
  back.addEventListener('click', closeBackup);
  var h2 = document.createElement('h2'); h2.style.flex='1'; h2.style.fontFamily='var(--font-display)'; h2.style.fontSize='1.05rem'; h2.textContent='Backup';
  head.appendChild(back); head.appendChild(h2);
  sheet.appendChild(head);

  var body = document.createElement('div'); body.className='sheet-body modal-body';

  var p1 = document.createElement('p'); p1.className='hint';
  p1.textContent = 'Os dados ficam salvos apenas neste navegador. Copie o texto abaixo para guardar uma cópia ou levar para outro dispositivo — a sincronização automática com o Google exige um app nativo, fora do alcance deste protótipo.';
  body.appendChild(p1);

  var ta = document.createElement('textarea');
  ta.className = 'backup-textarea';
  ta.readOnly = false;
  ta.value = JSON.stringify(state, null, 2);
  body.appendChild(ta);

  var row1 = document.createElement('div'); row1.className='btn-row';
  var copyBtn = document.createElement('button'); copyBtn.className='btn primary'; copyBtn.innerHTML = icon('copy')+'<span>Copiar</span>';
  copyBtn.addEventListener('click', function(){
    ta.value = JSON.stringify(state, null, 2);
    ta.focus(); ta.select();
    var copied = false;
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); copied = true; } }catch(e){}
    toast(copied ? 'Copiado para a área de transferência' : 'Texto selecionado — copie com Ctrl/Cmd+C');
  });
  var importBtn = document.createElement('button'); importBtn.className='btn'; importBtn.innerHTML = icon('upload')+'<span>Importar deste texto</span>';
  importBtn.addEventListener('click', function(){
    if(importBtn.dataset.armed==='1'){
      try{
        var parsed = JSON.parse(ta.value);
        if(!parsed || !Array.isArray(parsed.blocks)) throw new Error('formato inválido');
        state = parsed; save(); closeBackup(); render();
        toast('Backup importado');
      }catch(e){
        toast('Não consegui ler esse JSON — confira o texto');
      }
      importBtn.dataset.armed = '0';
      importBtn.innerHTML = icon('upload')+'<span>Importar deste texto</span>';
    } else {
      importBtn.dataset.armed = '1';
      importBtn.innerHTML = icon('warn')+'<span>Confirmar: substituir tudo?</span>';
      setTimeout(function(){ if(importBtn.dataset.armed==='1'){ importBtn.dataset.armed='0'; importBtn.innerHTML = icon('upload')+'<span>Importar deste texto</span>'; } }, 4000);
    }
  });
  row1.appendChild(copyBtn);
  body.appendChild(row1);
  var row2 = document.createElement('div'); row2.className='btn-row';
  row2.appendChild(importBtn);
  body.appendChild(row2);

  sheet.appendChild(body);
  ov.appendChild(sheet);
  requestAnimationFrame(function(){ ov.classList.add('open'); });
}
function closeBackup(){
  var ov = document.getElementById('backupOverlay');
  if(ov) ov.classList.remove('open');
  setTimeout(function(){ if(ov && ov.parentNode) ov.parentNode.removeChild(ov); }, 180);
}

/* ================= global click (close menus) ================= */
document.addEventListener('click', function(){ if(openMenuId){ openMenuId=null; render(); } });

/* ================= init ================= */
document.getElementById('btnArchive').innerHTML = icon('archive');
document.getElementById('btnBackup').innerHTML = icon('download');
document.getElementById('btnArchive').addEventListener('click', function(ev){ ev.stopPropagation(); openArchive(); });
document.getElementById('btnBackup').addEventListener('click', function(ev){ ev.stopPropagation(); openBackup(); });
document.getElementById('btnTheme').addEventListener('click', function(ev){ ev.stopPropagation(); cycleTheme(); });

applyTheme();
load();
render();

})();
</script>
</body>
